# These public-gateway functions validate the user (where required) inside the
# handler. Keep the deployed auth behavior explicit so a future deploy cannot
# silently flip it back to the CLI default.
[functions.get-home-stats]
enabled = true
verify_jwt = false
entrypoint = "./functions/get-home-stats/index.ts"

[functions.delete-user]
enabled = true
verify_jwt = false
entrypoint = "./functions/delete-user/index.ts"

[functions.trigger-audio-analysis]
enabled = true
verify_jwt = false
entrypoint = "./functions/trigger-audio-analysis/index.ts"

# Internal push webhooks authenticate an `apikey` against SUPABASE_SECRET_KEYS
# inside the handler. New sb_secret keys are not JWTs, so gateway JWT checks
# must stay disabled for these functions.
[functions.send-fcm-v1-push]
enabled = true
verify_jwt = false
entrypoint = "./functions/send-fcm-v1-push/index.ts"

[functions.new-post-notification]
enabled = true
verify_jwt = false
entrypoint = "./functions/new-post-notification/index.ts"

[functions.new-comment-notification]
enabled = true
